<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>関連資料一覧 | BMS</title>
	<link rel="stylesheet" th:href="@{/css/reset.css}" />
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<script th:src="@{/js/quote-preview.js}" defer></script>
</head>

<body>
	<nav class="sidebar">
		<div class="sidebar-logo">BMS System</div>
		<ul>
			<li><a th:href="@{/home}">ホーム</a></li>
			<li><a th:href="@{/clients}" class="active">顧客管理</a></li>
			<li><a th:href="@{/projects}">案件管理</a></li>
			<li><a th:href="@{/companys}">業者管理</a></li>
		</ul>
	</nav>

	<main class="main-content">
		<header>
			<h1>関連資料一覧</h1>
		</header>

		<div style="margin-bottom: 25px;">
			<span style="color: var(--text-muted); font-size: 0.9rem;">対象顧客：</span>
			<a th:href="@{/clients/{id}(id=${client.clientId})}" th:text="${client.clientName}"
				style="font-weight: bold; text-decoration: none; color: var(--accent); font-size: 1.1rem;">顧客名</a>
		</div>

		<div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

		<div class="card">
			<h3>資料登録</h3>
			<form th:action="@{/clients/{id}/documents/add(id=${client.clientId})}" method="post"
				enctype="multipart/form-data">
				<dl class="detail-list">
					<div class="detail-item">
						<dt>資料名</dt>
						<dd><input type="text" name="docTitle" required style="width: 100%; box-sizing: border-box;">
						</dd>
					</div>
					<div class="detail-item">
						<dt>分類</dt>
						<dd>
							<select name="docType" style="width: 100%;">
								<option value="機器一覧表">機器一覧表</option>
								<option value="機器配置図">機器配置図</option>
								<option value="画像">画像</option>
								<option value="その他">その他</option>
							</select>
						</dd>
					</div>
					<div class="detail-item">
						<dt>備考</dt>
						<dd>
							<textarea name="docRemarks"
								style="width: 100%; height: 80px; padding: 10px; border: 1px solid #dcdde1; border-radius: 8px; box-sizing: border-box;"></textarea>
						</dd>
					</div>
					<div class="detail-item">
						<dt>ファイルを選択</dt>
						<dd><input type="file" name="file" accept=".pdf, .jpg, .jpeg, .png" required></dd>
					</div>
				</dl>

				<div class="action-buttons">
					<button type="submit" class="btn btn-primary">登録する</button>
					<a th:href="@{/clients/{id}(id=${client.clientId})}" class="btn btn-secondary">顧客詳細へ戻る</a>
				</div>
			</form>
		</div>

		<div class="card">
			<h3>資料情報</h3>
			<div class="doc-grid" th:if="${not #lists.isEmpty(documents)}">
				<div class="doc-item" th:each="doc : ${documents}">
					<div class="preview-box">
						<iframe th:if="${doc.docFilePath.toLowerCase().endsWith('.pdf')}"
							th:src="@{'/' + ${doc.docFilePath} + '#view=Fit&scrollbar=0&toolbar=0&navpanes=0'}"
							scrolling="no"></iframe>
						<img th:if="${!doc.docFilePath.toLowerCase().endsWith('.pdf')}"
							th:src="@{'/' + ${doc.docFilePath}}" alt="プレビュー">
					</div>

					<a th:href="@{'/' + ${doc.docFilePath}}" target="_blank">
						<strong th:text="${doc.docTitle}">資料名</strong>
					</a>
					<div class="doc-meta" th:text="${doc.docType}">分類</div>
					<div class="doc-meta" th:text="${#temporals.format(doc.docCreatedAt, 'yyyy/MM/dd')}">日付</div>

					<div class="remarks-container">
						<details th:if="${doc.docRemarks != null and doc.docRemarks != ''}">
							<summary>備考を表示</summary>
							<p><span th:text="${doc.docRemarks}"></span></p>
						</details>
					</div>

					<form
						th:action="@{/clients/{id}/documents/delete/{docId}(id=${client.clientId}, docId=${doc.docId})}"
						method="post" style="margin-top: auto; padding-top: 15px;">

						<a href="#" class="btn-text-danger"
							onclick="if(confirm('削除しますか？')) { this.parentNode.submit(); } return false;">削除</a>
					</form>
				</div>
			</div>
			<p th:if="${#lists.isEmpty(documents)}" style="text-align:center; padding:20px;">登録されている資料はありません。</p>
		</div>
	</main>
</body>

</html>
