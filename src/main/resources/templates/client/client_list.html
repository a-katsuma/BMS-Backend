<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>顧客一覧 | BMS</title>
	<link rel="stylesheet" th:href="@{/css/reset.css}" />
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<script th:src="@{/js/input.js}" defer></script>
</head>

<body>
	<nav class="sidebar">
		<div class="sidebar-logo">BMS System</div>
		<ul>
			<li><a th:href="@{/home}">ホーム</a></li>
			<li><a th:href="@{/clients}" class="active">顧客管理</a></li>
			<li><a th:href="@{/projects}">案件管理</a></li>
			<li><a th:href="@{/companys}">業者管理</a></li>
		</ul>
	</nav>

	<main class="main-content">
		<div class="content-wrapper">
			<header>
				<h1>顧客管理</h1>
			</header>

			<div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

			<div class="action-bar">
				<a th:href="@{/clients/add}" class="btn btn-primary">新規顧客登録</a>
			</div>

			<div class="card">
				<h3>顧客一覧</h3>
				<div class="kana-filter">
					<a th:href="@{/clients(kana='', page=1)}" th:classappend="${currentKana == ''} ? 'active'">全件</a>

					<a th:each="k : ${ {'あ行', 'か行', 'さ行', 'た行', 'な行', 'は行', 'ま行', 'や行', 'ら行', 'わ行'} }"
						th:href="@{/clients(kana=${k}, page=1)}" th:text="${k}"
						th:classappend="${k == currentKana} ? 'active'"></a>
				</div>
				<table class="data-table" th:if="${clients != null and not #lists.isEmpty(clients)}">
					<thead>

						<tr>
							<!--							<th>ID</th>-->
							<th>顧客名</th>
							<th>郵便番号</th>
							<th>住所</th>
							<th>電話番号</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="c : ${clients}">
							<td data-label="顧客名" th:text="${c?.clientName}"></td>

							<td data-label="郵便番号" th:text="${c?.formattedClientPostalcode}"></td>

							<td data-label="住所" th:text="${c?.clientAddress}"></td>

							<td data-label="電話番号" th:text="${c?.formattedClientPhone}"></td>

							<td data-label="操作">
								<a th:href="@{/clients/{id}(id=${c?.clientId})}" class="btn btn-primary">詳細</a>
							</td>
						</tr>
					</tbody>
				</table>
				<div class="pagination" th:if="${totalPages > 0}">
					<a th:href="@{/clients(kana=${currentKana}, page=${currentPage-1})}"
						th:if="${currentPage > 1}">前のページ</a>

					<th:block th:if="${totalPages > 1}" th:each="i : ${#numbers.sequence(1, totalPages)}">
						<th:block th:switch="${i == currentPage}">
							<span th:case="true" th:text="'| ' + ${i} + ' '"></span>
							<a th:case="false" th:href="@{/clients(kana=${currentKana}, page=${i})}"
								th:text="'| ' + ${i} + ' '"></a>
						</th:block>
					</th:block>

					<a th:href="@{/clients(kana=${currentKana}, page=${currentPage+1})}"
						th:if="${currentPage < totalPages}">次のページ</a>
				</div>
				<div class="no-data" th:if="${clients == null or #lists.isEmpty(clients)}">
					現在、登録されている顧客はありません。
				</div>
			</div>
		</div>
	</main>
</body>

</html>
