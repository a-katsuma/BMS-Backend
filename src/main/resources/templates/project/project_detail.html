<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>案件詳細 | BMS</title>
	<link rel="stylesheet" th:href="@{/css/reset.css}" />
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<script th:src="@{/js/quote-preview.js}" defer></script>
</head>

<body>
	<nav class="sidebar">
		<div class="sidebar-logo">BMS System</div>
		<ul>
			<li><a th:href="@{/home}">ホーム</a></li>
			<li><a th:href="@{/clients}">顧客管理</a></li>
			<li><a th:href="@{/projects}" class="active">案件管理</a></li>
			<li><a th:href="@{/companys}">業者管理</a></li>
		</ul>
	</nav>

	<main class="main-content">
		<header>
			<h1>案件詳細</h1>
		</header>

		<div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

		<div class="card">
			<h3>案件情報</h3>
			<dl class="detail-list">
				<div class="detail-item">
					<dt>顧客名</dt>
					<dd>
						<a th:href="@{/clients/{id}(id=${project.clientId})}" th:text="${project.clientName}"></a>
					</dd>
				</div>
				<div class="detail-item">
					<dt>案件名</dt>
					<dd th:text="${project.projectName}"></dd>
				</div>
				<div class="detail-item">
					<dt>発注業者</dt>
					<dd>
						<a th:href="@{/companys/{id}(id=${project.companyId})}" th:text="${project.companyName}"></a>
					</dd>
				</div>
				<div class="detail-item">
					<dt>契約種別</dt>
					<dd th:text="${project.contractType}"></dd>
				</div>
				<div class="detail-item">
					<dt>担当者名</dt>
					<dd th:text="${project.projectStaffname}"></dd>
				</div>
				<div class="detail-item">
					<dt>案件状態</dt>
					<dd th:text="${project.status}"></dd>
				</div>
				<div class="detail-item">
					<dt>特記事項</dt>
					<dd th:text="${project.projectRemarks}" style="white-space: pre-wrap;"></dd>
				</div>
			</dl>
			<div class="action-buttons">
				<a th:href="@{/projects/edit/{id}(id=${project.projectId})}" class="btn">案件を編集</a>
				<a th:href="@{/projects/delete/{id}(id=${project.projectId})}" class="btn btn-danger"
					onclick="return confirm('案件を削除しますか？');">案件を削除</a>
				<a th:href="@{/projects}" class="btn btn-secondary">案件一覧へ戻る</a>
			</div>
		</div>

		<div class="card">
			<h3>見積情報・履歴</h3>

			<th:block th:if="${latestQuote}">
				<dl class="detail-list" style="margin-bottom: 20px;">
					<div class="detail-item">
						<dt>見積ファイル</dt>
						<dd><a th:href="@{'/' + ${latestQuote.quoteFilepath}}" target="_blank">PDFを表示</a></dd>
					</div>
					<div class="detail-item">
						<dt>現在の判定状態</dt>
						<dd th:text="${latestQuote.quoteStatus}"></dd>
					</div>
					<div class="detail-item">
						<dt>判定期限</dt>
						<dd>
							<span th:text="${latestQuote.deadlineDate != null ? latestQuote.deadlineDate : '期限設定なし'}"
								th:classappend="${latestQuote.deadlineDate != null and latestQuote.deadlineDate.isBefore(T(java.time.LocalDate).now())} ? 'text-danger' : ''"></span>

							<span
								th:if="${latestQuote.deadlineDate != null and latestQuote.deadlineDate.isBefore(T(java.time.LocalDate).now())}"
								class="text-danger">
								(期限切れ)
							</span>
						</dd>
					</div>
					<div class="detail-item">
						<dt>最終更新日</dt>
						<dd th:text="${latestQuote.quoteDate}"></dd>
					</div>
				</dl>

				<div class="action-buttons quote-action-buttons">
					<a th:href="@{/projects/{pid}/quotes/edit/{id}(pid=${project.projectId}, id=${latestQuote.quoteId})}"
						class="btn btn-secondary">見積を編集</a>
					<a th:href="@{/projects/{pid}/quotes/delete/{id}(pid=${project.projectId}, id=${latestQuote.quoteId})}"
						class="btn btn-danger" onclick="return confirm('この見積を削除しますか？');">見積を削除</a>
				</div>
			</th:block>

			<th:block th:if="${latestQuote == null}">
				<div class="add-quote-area" id="add-quote-area">
					<p class="no-quote-msg">現在、登録されている見積はありません。</p>

					<form th:action="@{/projects/{pid}/quotes/add(pid=${project.projectId})}" method="post"
						enctype="multipart/form-data">
						<div class="form-group-block">
							<label>見積PDFファイルを選択</label>
							<input type="file" name="file" id="file-input" accept=".pdf" required
								onchange="enablePreviewButton()">
						</div>

						<div class="form-group-block">
							<label>判定期限</label>
							<input type="date" name="deadlineDate" required>
						</div>

						<button type="button" id="preview-btn" class="btn" style="display:none;"
							onclick="openModal()">プレビューを表示</button>
						<button type="submit" class="btn btn-primary btn-submit-quote">登録する</button>
					</form>
				</div>
			</th:block>

			<div id="pdf-modal" class="pdf-modal">
				<div class="pdf-modal-content">
					<button type="button" class="modal-close-btn" onclick="closeModal()">閉じる ×</button>
					<embed id="pdf-modal-preview" type="application/pdf" width="100%" height="90%"
						style="margin-top: 30px;" />
				</div>
			</div>

			<table class="data-table">
				<thead>
					<tr>
						<th>更新日</th>
						<th>判定状態</th>
						<th>判定者</th>
						<th>ファイル</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="h : ${historyList}" th:if="${not #lists.isEmpty(historyList)}">
						<td th:text="${h.quoteDate}"></td>


						<td th:text="${h.quoteStatus}"></td>
						<td data-label="判定者" th:text="${h.judgeUser}"></td>
						<td><a th:href="@{'/' + ${h.quoteFilepath}}" target="_blank">閲覧</a></td>
					</tr>
					<tr th:if="${#lists.isEmpty(historyList)}">
						<td colspan="3" style="text-align: center;">履歴はありません。</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>
</body>

</html>
