<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>業者一覧 | BMS</title>
	<link rel="stylesheet" th:href="@{/css/reset.css}" />
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<script th:src="@{/js/client.js}" defer></script>
</head>

<body>
	<nav class="sidebar">
		<div class="sidebar-logo">BMS System</div>
		<ul>
			<li><a th:href="@{/home}">ホーム</a></li>
			<li><a th:href="@{/clients}">顧客管理</a></li>
			<li><a th:href="@{/projects}">案件管理</a></li>
			<li><a th:href="@{/companys}" class="active">業者管理</a></li>
		</ul>
	</nav>

	<main class="main-content">
		<div class="content-wrapper">
			<header>
				<h1>業者管理</h1>
			</header>

			<div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

			<div class="action-bar">
				<a th:href="@{/companys/add}" class="btn btn-primary">新規業者登録</a>
			</div>

			<div class="card">
				<h3>業者一覧</h3>
				<div class="kana-filter">
					<a th:href="@{/companys(kana='', page=1)}" th:classappend="${companyKana == ''} ? 'active'">全件</a>

					<a th:each="k : ${ {'あ行', 'か行', 'さ行', 'た行', 'な行', 'は行', 'ま行', 'や行', 'ら行', 'わ行'} }"
						th:href="@{/companys(kana=${k}, page=1)}" th:text="${k}"
						th:classappend="${k == companyKana} ? 'active'"></a>
				</div>
				<table class="data-table" th:if="${companys != null and not #lists.isEmpty(companys)}">
					<thead>
						<tr>
							<!--							<th>ID</th>-->
							<th>業者名</th>
							<th>郵便番号</th>
							<th>住所</th>
							<th>電話番号</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="c : ${companys}" th:if="${c != null}">
							<!--							<td data-label="ID" th:text="${c.companyId}"></td>-->
							<td data-label="業者名" th:text="${c.companyName}"></td>
							<td data-label="郵便番号" th:text="${c.formattedCompanyPostalcode}"></td>
							<td data-label="住所" th:text="${c.companyAddress}"></td>
							<td data-label="電話番号" th:text="${c.formattedCompanyPhone}"></td>
							<td data-label="操作">
								<a th:href="@{/companys/{id}(id=${c.companyId})}" class="btn btn-primary">詳細</a>
							</td>
						</tr>
					</tbody>
				</table>
				<div class="pagination" th:if="${totalPages > 0}">
					<a th:href="@{/companys(kana=${currentKana}, page=${currentPage-1})}"
						th:if="${currentPage > 1}">前のページ</a>

					<th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
						<a th:href="@{/companys(kana=${currentKana}, page=${i})}" th:text="${i}"
							th:classappend="${i == currentPage} ? 'active'"></a>
					</th:block>

					<a th:href="@{/companys(kana=${currentKana}, page=${currentPage+1})}"
						th:if="${currentPage < totalPages}">次のページ</a>
				</div>
				<div class="no-data" th:if="${companys == null or #lists.isEmpty(companys)}">
					現在、登録されている業者はありません。
				</div>
			</div>
		</div>
	</main>
</body>

</html>
