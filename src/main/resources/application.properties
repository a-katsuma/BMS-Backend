# \u30c7\u30fc\u30bf\u30d9\u30fc\u30b9\u63a5\u7d9a\u8a2d\u5b9a\uff08\u672c\u756a\u306f\u74b0\u5883\u5909\u6570 DB_URL\u30fbDB_USERNAME\u30fbDB_PASSWORD \u3067\u4e0a\u66f8\u304d\u3059\u308b\uff09
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/project_system_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# MyBatis\u306e\u8a2d\u5b9a
mybatis.mapper-locations=classpath*:/mybatis/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.example.app.domain
logging.level.web=INFO
# SQL \u306e\u30ed\u30b0\uff08\u672c\u756a\u306f\u74b0\u5883\u5909\u6570 MAPPER_LOG_LEVEL=INFO \u3067\u6b62\u3081\u308b\uff09
logging.level.com.example.app.mapper.*=${MAPPER_LOG_LEVEL:DEBUG}

# \u30e1\u30fc\u30eb\u8a2d\u5b9a\uff08\u958b\u767a\u306f localhost:1025\u3002\u672c\u756a\u306f\u74b0\u5883\u5909\u6570 MAIL_HOST\u30fbMAIL_PORT \u3067 Mailpit \u306b\u5411\u3051\u308b\uff09
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# \u30a2\u30c3\u30d7\u30ed\u30fc\u30c9\u306e\u4e0a\u9650\uff08\u521d\u671f\u5024\u306e 1MB \u3067\u306f PDF \u304c\u5165\u3089\u306a\u3044\u3053\u3068\u304c\u3042\u308b\u305f\u3081\uff09
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# \u753b\u9762\u306e URL\uff08\u30d1\u30b9\u30ef\u30fc\u30c9\u518d\u8a2d\u5b9a\u30e1\u30fc\u30eb\u306e\u30ea\u30f3\u30af\u306b\u4f7f\u3046\u3002\u672c\u756a\u306f\u74b0\u5883\u5909\u6570 FRONTEND_BASE_URL\uff09
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# CORS \u3067\u8a31\u53ef\u3059\u308b\u753b\u9762\u306e URL\uff08\u30ab\u30f3\u30de\u533a\u5207\u308a\u3067\u8907\u6570\u53ef\u3002\u672c\u756a\u306f\u74b0\u5883\u5909\u6570 CORS_ALLOWED_ORIGINS\uff09
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# デモモード（公開デモの環境だけ true。true のときだけ、パスワードなしのデモ用ログインが使える）
app.demo.enabled=${DEMO_ENABLED:false}

# デモ用ログインで使うアカウントのログインID（管理者・業者の代表・業者の一般）
app.demo.admin-login-id=${DEMO_ADMIN_LOGIN_ID:demo-admin@example.com}
app.demo.master-login-id=${DEMO_MASTER_LOGIN_ID:demo-master@example.com}
app.demo.general-login-id=${DEMO_GENERAL_LOGIN_ID:demo-general@example.com}


# メールを実際に送るか（開発は false＝コンソールに表示するだけ。Docker は環境変数 MAIL_ENABLED=true で送る）
app.mail.enabled=${MAIL_ENABLED:false}
# 送信元のアドレス
app.mail.from=${MAIL_FROM:no-reply@example.com}
